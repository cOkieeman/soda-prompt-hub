<template id="creationCanvasTemplate">
  <header class="creation-panel-header">
    <h2><span data-canvas-icon="brush"></span>畫布</h2>
    <button type="button" id="creationCollapse" aria-label="收起畫布面板" title="收起畫布面板" aria-controls="creationScroll creationFooter" aria-expanded="true">
      <span data-canvas-icon="chevron-left"></span><span class="creation-collapse-label">畫布</span>
    </button>
  </header>
  <div class="creation-scroll" id="creationScroll">
    <section class="creation-size-section">
      <h3>圖像尺寸</h3>
      <select id="creationSizePreset" aria-label="尺寸預設"><option value="832x1216">常規 · 豎屏（832 × 1216）</option><option value="1216x832">常規 · 橫屏（1216 × 832）</option><option value="1024x1024">常規 · 方形（1024 × 1024）</option><option value="1024x1536">大圖 · 豎屏（1024 × 1536）</option><option value="1536x1024">大圖 · 橫屏（1536 × 1024）</option><option value="custom">自訂尺寸</option></select>
      <div class="creation-dimensions"><div id="creationWidth"></div><span aria-hidden="true">×</span><div id="creationHeight"></div><button type="button" id="creationSwapSize" aria-label="交換寬高"><span data-canvas-icon="swap"></span></button></div>
    </section>
    <section class="creation-seed-section"><h3>種子</h3><div class="creation-seed"><input id="creationSeed" type="text" inputmode="numeric" autocomplete="off" aria-label="出圖種子或隨機" placeholder="隨機"><button type="button" id="creationSeedLock" aria-label="鎖定出圖種子" aria-pressed="false"><span data-canvas-icon="unlock"></span></button></div></section>
    <section class="creation-prompts">
      <div class="creation-prompt-toolbar"><div class="creation-prompt-tabs" role="tablist" aria-label="提示詞編輯"><button type="button" role="tab" id="creationPositiveTab" data-canvas-tab="positive" aria-controls="creationPositive" aria-selected="true"><span data-canvas-icon="sparkles"></span><span>正面</span><small id="creationPositiveCount">0</small></button><button type="button" role="tab" id="creationNegativeTab" data-canvas-tab="negative" aria-controls="creationNegative" aria-selected="false"><span data-canvas-icon="ban"></span><span>負面</span><small id="creationNegativeCount">0</small></button><button type="button" role="tab" id="creationFixedTab" data-canvas-tab="fixed" aria-controls="creationFixed" aria-selected="false"><span data-canvas-icon="pin"></span><span>固定詞</span></button></div><div class="creation-prompt-presets"><label class="creation-quality"><span data-canvas-icon="sparkles"></span><select id="creationQuality" aria-label="品質詞"><option value="">品質詞</option><option value="standard">標準品質詞</option><option value="light">輕量品質詞</option><option value="none">關閉品質詞</option></select></label><label class="creation-uc"><span data-canvas-icon="ban"></span><select id="creationUc" aria-label="負面預設"><option value="none">無預設</option><option value="heavy">重度</option><option value="light">輕度</option><option value="humanFocus">人物</option><option value="furryFocus">Furry</option></select></label></div></div>
      <div id="creationPositive" role="tabpanel" aria-labelledby="creationPositiveTab" class="creation-prompt-panel"></div>
      <div id="creationNegative" role="tabpanel" aria-labelledby="creationNegativeTab" class="creation-prompt-panel" hidden></div>
      <div id="creationFixed" role="tabpanel" aria-labelledby="creationFixedTab" class="creation-prompt-panel creation-fixed" hidden></div>
      <div class="creation-prompt-footer"><button type="button" id="creationTransparent" class="creation-text-button" aria-pressed="false">透明背景</button><button type="button" id="creationHighlight" class="creation-text-button" aria-label="提示詞語法高亮" aria-pressed="true">Tt</button><button type="button" id="creationMaterial" aria-label="從提示詞庫選詞"><span data-canvas-icon="tag"></span></button><span class="creation-spacer"></span><div id="creationDraw"></div><button type="button" id="creationClear" aria-label="清除目前提示詞"><span data-canvas-icon="x"></span></button><button type="button" id="creationUndoClear" hidden>復原</button><button type="button" id="creationRandomSettings" aria-label="隨機詞設定" aria-expanded="false"><span data-canvas-icon="settings"></span></button><span id="creationCharCount" class="creation-char-count"></span></div>
    </section>
    <details class="creation-section" id="creationRandom"><summary><span data-canvas-icon="dice"></span><span>隨機詞與批次</span><span class="creation-chevron" data-canvas-icon="chevron-down"></span></summary><div class="creation-section-content" id="creationRandomContent"></div></details>
    <details class="creation-section" id="creationCharacters" data-novelai-only><summary><span data-canvas-icon="user"></span><span>角色</span><div class="creation-character-shortcuts"><button type="button" data-character-tag="1girl">女</button><button type="button" data-character-tag="1boy">男</button><button type="button" data-character-tag="other">其他</button><button type="button" id="creationCharacterLibrary">詞庫</button></div><span class="creation-chevron" data-canvas-icon="chevron-down"></span></summary><div class="creation-section-content" id="creationCharactersContent"></div></details>
    <details class="creation-section" id="creationReverse"><summary><span data-canvas-icon="scan"></span><span>反推</span><span class="creation-chevron" data-canvas-icon="chevron-down"></span></summary><div class="creation-section-content"><label class="creation-upload">加入反推圖片<input type="file" accept="image/png,image/jpeg,image/webp" data-canvas-reference="reverse"></label><label>選擇參考圖<select id="creationReverseImage"></select></label><label>視覺模型<select id="creationReverseModel"></select></label><button type="button" id="creationReverseRun">反推提示詞</button><p id="creationReverseStatus" role="status"></p><textarea id="creationReverseResult" rows="4" aria-label="反推結果" readonly hidden></textarea><button type="button" id="creationReverseApply" hidden>套用到正文</button></div></details>
    <details class="creation-section" id="creationImg2img" data-novelai-only><summary><span data-canvas-icon="image"></span><span>圖生圖</span><small data-reference-count="img2img"></small><span class="creation-chevron" data-canvas-icon="chevron-down"></span></summary><div class="creation-section-content"><label class="creation-upload">加入來源圖<input type="file" accept="image/png,image/jpeg,image/webp" data-canvas-reference="img2img"></label><div data-reference-mount="img2img" class="creation-reference-grid"></div><div id="creationImg2imgParameters"></div></div></details>
    <details class="creation-section" id="creationVibe" data-novelai-only><summary><span data-canvas-icon="wand"></span><span>風格遷移</span><small data-reference-count="vibe"></small><span class="creation-chevron" data-canvas-icon="chevron-down"></span></summary><div class="creation-section-content"><label class="creation-upload">加入畫風參考<input type="file" accept="image/png,image/jpeg,image/webp" multiple data-canvas-reference="vibe"></label><p class="creation-capability" data-reference-capability="vibe" hidden></p><div data-reference-mount="vibe" class="creation-reference-grid"></div></div></details>
    <details class="creation-section" id="creationPrecise" data-novelai-only><summary><span data-canvas-icon="target"></span><span>精準參考</span><small data-reference-count="precise"></small><span class="creation-chevron" data-canvas-icon="chevron-down"></span></summary><div class="creation-section-content"><label class="creation-upload">加入角色／服裝參考<input type="file" accept="image/png,image/jpeg,image/webp" multiple data-canvas-reference="precise"></label><p class="creation-capability" data-reference-capability="precise" hidden></p><div data-reference-mount="precise" class="creation-reference-grid"></div></div></details>
    <details class="creation-section" id="creationComfy" data-comfy-only><summary><span data-canvas-icon="workflow"></span><span>工作流與參考</span><span class="creation-chevron" data-canvas-icon="chevron-down"></span></summary><div class="creation-section-content" id="creationComfyContent"></div></details>
    <div id="creationLegacyControls" hidden></div>
  </div>
  <footer class="creation-footer" id="creationFooter">
    <details class="creation-parameters" id="creationParameters"><summary><span>參數</span><span id="creationModelLabel"></span><span data-canvas-icon="chevron-up"></span></summary><div class="creation-parameter-content"><div id="creationConnection"></div><div id="creationModel"></div><div id="creationSampler"></div><div class="creation-sampling-values" id="creationSamplingValues"></div><div id="creationAdvanced"></div></div></details>
      <div class="creation-generate-bar"><div id="creationPreview"></div><div id="creationGenerate"></div><div id="creationCount"></div><span class="creation-autosave"><span data-canvas-icon="check"></span><span id="creationSaveState">自動保存</span></span></div>
      <div id="creationGenerationProgress" class="creation-generation-progress" role="status" aria-live="polite" hidden>
        <strong id="creationGenerationLabel"></strong>
        <progress id="creationGenerationBar" max="100" aria-label="生成進度"></progress>
        <span id="creationGenerationMessage" class="creation-generation-message"></span>
      </div>
  </footer>
</template>
